name: astrbot_plugin_nyaa_keyword_reply
display_name: Nyaa简易关键字回复
desc: 群聊关键词触发器：命中关键词即按机器人原生唤醒逻辑回复，复用 bot 自身的 provider / 人格 / 上下文；并支持 QQ 号黑名单，彻底忽略黑名单用户的一切群聊唤醒（关键词 / @ / 唤醒词）。
help: 在 WebUI 插件配置页填写触发关键词；群成员发言命中后，机器人会像被 @ 一样原生回复。可在「黑名单 QQ 号」中按 QQ 号（精确匹配）加入要彻底忽略的用户，对其关键词与 @ 唤醒一并无视。
version: 2.1.1
author: NyaaCaster
repo: https://github.com/NyaaCaster/astrbot_plugin_nyaa_keyword_reply
astrbot_version: ">=4.0.0"
